[project]
name = "cardiodiag-research"
version = "0.1.0"
description = "Leakage-controlled reproduction and robustness extension of CARDIODIAG"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "imbalanced-learn>=0.14,<0.15",
  "joblib>=1.5,<2",
  "lime>=0.2.0.1,<0.3",
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<1.8",
  "scipy>=1.14,<2",
  "xgboost>=3.0,<4",
  "lightgbm>=4.7,<5",
  "catboost>=1.2,<2",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.13,<0.14",
]

[project.scripts]
cardiodiag = "cardiodiag.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
